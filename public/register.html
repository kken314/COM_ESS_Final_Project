<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Prompt Prung</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="/js/theme.js"></script>
</head>
<body class="auth-page">
  <button class="theme-toggle theme-toggle-float" id="themeToggle" onclick="toggleTheme()" aria-label="Switch to dark mode"></button>
  <main class="auth-card">
    <div class="brand">
      <div class="brand-mark">Prompt Prung</div>
      <div class="brand-tag">Recipe Finder</div>
    </div>

    <h1>Create account</h1>
    <p class="auth-subtitle">Snap your fridge. Find what you can cook.</p>

    <div id="alert" class="alert"></div>

    <form id="authForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required minlength="3" />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" autocomplete="new-password" required minlength="6" />
          <button type="button" class="eye-toggle" id="eyeToggle" aria-label="Show password">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary">Create account</button>
    </form>

    <div class="auth-switch">
      Already have an account? <a href="/login.html">Sign in</a>
    </div>
  </main>

  <script>window.PAGE_MODE = 'register';</script>
  <script src="/js/eye-toggle.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
