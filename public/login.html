<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Prompt Prung</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand">
      <div class="brand-mark">Prompt Prung</div>
      <div class="brand-tag">Recipe Finder</div>
    </div>

    <h1>Welcome back</h1>
    <p class="auth-subtitle">Sign in to start cooking with what you have.</p>

    <div id="alert" class="alert"></div>

    <form id="authForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" autocomplete="current-password" required />
          <button type="button" class="eye-toggle" id="eyeToggle" aria-label="Show password">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary">Sign in</button>
    </form>

    <div class="auth-switch">
      Don't have an account? <a href="/register.html">Create one</a>
    </div>
  </main>

  <script>
    window.PAGE_MODE = 'login';
    document.getElementById('eyeToggle').addEventListener('click', function () {
      var input = document.getElementById('password');
      var isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      this.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      document.getElementById('eyeIcon').innerHTML = isHidden
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    });
  </script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
